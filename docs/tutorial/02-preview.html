<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>效果预览</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="tutorial-card">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>

        <h1 class="title">效果预览</h1>
        <p class="subtitle">18种动画动作，覆盖日常行为</p>

        <div class="grid-2x3">
            <div class="grid-item">
                <img src="images/stand.png" alt="站立" style="height: 120px; object-fit: contain;">
                <span>站立</span>
            </div>
            <div class="grid-item">
                <img src="images/walk.png" alt="行走" style="height: 120px; object-fit: contain;">
                <span>行走</span>
            </div>
            <div class="grid-item">
                <img src="images/sleep.png" alt="睡觉" style="height: 120px; object-fit: contain;">
                <span>睡觉</span>
            </div>
            <div class="grid-item">
                <img src="images/jump.png" alt="跳跃" style="height: 120px; object-fit: contain;">
                <span>跳跃</span>
            </div>
            <div class="grid-item">
                <img src="images/roll.png" alt="打滚" style="height: 120px; object-fit: contain;">
                <span>打滚</span>
            </div>
            <div class="grid-item">
                <img src="images/feed.png" alt="喂食" style="height: 120px; object-fit: contain;">
                <span>喂食</span>
            </div>
        </div>

        <div class="feature-list">
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span class="feature-text">模拟养成系统（饥饿值、亲密度）</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span class="feature-text">实时交互（点击、拖拽、喂食）</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span class="feature-text">智能行为（自动行走、睡觉、排便）</span>
            </div>
        </div>

        <div class="page-number">2/8</div>
    </div>
</body>
</html>
